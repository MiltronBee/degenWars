<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>degenWars · Layout B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Limelight&family=Chakra+Petch:wght@400;600;700&family=Special+Elite&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b08;--panel:#1c1611;--panel2:#2a2119;--line:#4d3c29;--ink:#ecdfc6;--mute:#a8977a;--gold:#d9a441;--brass:#b8893a;--red:#b8323a;--green:#8fb36a;--blue:#5fa3a0;
 --brassg:linear-gradient(180deg,#f0cf86 0,#b8893a 22%,#7a5420 48%,#c79a4a 70%,#5e3f17 100%);--iron:linear-gradient(180deg,#3a3028,#221b15);
 /* art-brief palette (docs/art-brief.md); cadmium/warn/mustard are win-only accents */
 --ivory:#D4C9AD;--umber:#A58F70;--burnt:#5C4838;--ochre:#AF9561;--olive:#62644C;--oxide:#864F3B;--charcoal:#30312F;--ash:#898F8C;--khaki:#B6AD94;--steel:#485354;--bone:#DDD9CE;--carbon:#211E1B;--cadmium:#B3261E;--warn:#D9772B;--mustard:#C9A23A}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 'Chakra Petch',system-ui,sans-serif;background:radial-gradient(1200px 600px at 30% -200px,#3a2a1a 0,transparent 70%),radial-gradient(900px 500px at 100% 110%,#13201f 0,transparent 70%),var(--bg);min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.wrap{max-width:1180px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left))}
h1,h2,h3,.disp{font-family:'Russo One','Chakra Petch',sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
.brand{font-family:'Limelight','Russo One',serif}
.btn{background:var(--iron);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:700;transition:transform .08s,filter .15s;box-shadow:inset 0 1px 0 rgba(255,230,180,.12),0 3px 0 #0a0806}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,230,180,.12),0 1px 0 #0a0806}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--brassg);color:#1e1306;border-color:#f2d08a;text-shadow:0 1px 0 rgba(255,235,190,.5);box-shadow:inset 0 1px 0 rgba(255,245,210,.7),0 4px 0 #4a300f,0 6px 14px rgba(0,0,0,.45)}
.btn.red{background:linear-gradient(#cf4a4f,#8e1f27);border-color:#e0868a;color:#fbe9e0;box-shadow:inset 0 1px 0 rgba(255,210,200,.45),0 4px 0 #4a0d12}
.btn.on{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.hud .title{font-family:'Limelight','Russo One',serif;font-size:22px;margin-right:auto;color:#e8d6b0}
.title b{color:var(--gold);font-weight:400}
.stat{display:flex;align-items:center;gap:6px;background:linear-gradient(#2a2119,#1a140f);border:1px solid #6a5232;border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,220,160,.12)}
.stat i{font-style:normal;color:var(--mute);font-weight:600;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 6px currentColor}
/* layout */
.game{display:grid;gap:14px}
@media(min-width:980px){.game{grid-template-columns:430px 1fr;align-items:start}.slotcol{grid-column:1;grid-row:1}.fieldcol{grid-column:2;grid-row:1}}
/* ---------- slot cabinet ---------- */
.machine{position:relative;border-radius:26px 26px 18px 18px;padding:10px 12px 14px;border:3px solid #8a6630;
 background:linear-gradient(180deg,rgba(20,12,8,.25),rgba(14,9,6,.7)),url(art/cabinet.webp) center/cover,#3a1a14;
 box-shadow:inset 0 0 0 2px #2a1a0c,inset 0 0 40px rgba(0,0,0,.75),0 10px 30px rgba(0,0,0,.6)}
.marquee{position:relative;width:min(100%,520px);margin:0 auto 8px;aspect-ratio:1100/467;background:url(art/marquee.webp) center/100% 100% no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.7));border-radius:14px 14px 4px 4px;display:grid;place-items:center}
.mq-in{position:absolute;left:21%;right:21%;top:37%;bottom:19%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.mq-title{font-family:'Limelight','Russo One',serif;font-size:clamp(18px,8cqw,46px);color:#ffe2a6;letter-spacing:.02em;text-shadow:0 0 6px rgba(255,170,60,.9),0 0 18px rgba(255,120,30,.55),0 2px 0 #3a1a08;animation:hum 5s infinite}
.mq-title b{color:#ff8a5a;font-weight:400;text-shadow:0 0 6px rgba(255,80,40,.9),0 0 18px rgba(200,40,20,.6),0 2px 0 #3a0808}
.mq-sub{font-size:clamp(9px,2.3cqw,12px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d9b880;margin-top:4px;opacity:.85}
.marquee{container-type:inline-size}
@container (max-width:300px){.mq-sub{display:none}}
@keyframes hum{0%,91%,100%{opacity:1}92%{opacity:.55}93%{opacity:1}95%{opacity:.7}96%{opacity:1}}
.cabrow{display:flex;justify-content:center;align-items:stretch;gap:4px}
.cabcol{flex:1 1 auto;max-width:100%}
.bezel{position:relative;padding:15px;border-radius:18px;background:var(--brassg);box-shadow:inset 0 0 0 2px #3a2610,inset 0 2px 0 rgba(255,240,200,.6),0 6px 14px rgba(0,0,0,.6)}
.bezel::before{content:"";position:absolute;inset:4px;border-radius:14px;background:repeating-linear-gradient(115deg,rgba(60,90,70,.0) 0 9px,rgba(60,110,90,.07) 9px 11px),radial-gradient(circle at 80% 90%,rgba(40,90,80,.45),transparent 40%),radial-gradient(circle at 10% 20%,rgba(30,20,10,.5),transparent 35%);pointer-events:none}
.bezel{--chase:2.4s}
.bezel.jolt{animation:jolt .16s}
@keyframes jolt{40%{transform:translateY(2px)}}
.bulb{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c8,#e7a03c 45%,#7a3a0a 80%);box-shadow:0 0 6px 2px rgba(255,170,60,.8);animation:chase var(--chase) linear infinite;animation-delay:calc(var(--i) * var(--chase) / -20)}
.bulb.dead{background:radial-gradient(circle at 35% 35%,#8a7a60,#3a2e20 70%);box-shadow:none;animation:none}
@keyframes chase{0%,55%{opacity:.4}62%,80%{opacity:1}}
.bezel.flare .bulb:not(.dead){animation:flare .14s steps(2) infinite}
.bezel.flare .bulb:nth-child(2n):not(.dead){animation-delay:-.07s}
@keyframes flare{0%{opacity:1;transform:scale(1.35)}100%{opacity:.35}}
.bezel.sag .bulb{animation-play-state:paused;opacity:.35;transition:opacity .2s}
.attract .bulb:not(.dead){animation:twinkle 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.37s)}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.attract .mq-sub{animation:blink 1s steps(2) infinite;color:#ffcf7a}
@keyframes blink{50%{opacity:.25}}
.win-glow .mq-title{animation:mqflare .5s 3}
@keyframes mqflare{50%{filter:brightness(1.6)}}
.window{position:relative;border-radius:10px;padding:6px;background:#120c08;touch-action:none;box-shadow:inset 0 0 0 2px #2a1c0c,inset 0 6px 14px rgba(0,0,0,.9)}
.window::after{content:"";position:absolute;inset:6px;border-radius:6px;pointer-events:none;z-index:3;
 background:linear-gradient(115deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.04) 22%,transparent 23%,transparent 60%,rgba(255,255,255,.06) 61%,transparent 72%),
 linear-gradient(180deg,rgba(10,6,2,.55) 0,transparent 16%,transparent 84%,rgba(10,6,2,.6) 100%)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;position:relative}
.reel{display:grid;gap:0;border-radius:4px;overflow:hidden;
 background:linear-gradient(180deg,#5c4a30 0,#b9a77e 9%,#e8dcbc 26%,#f3ead0 50%,#e8dcbc 74%,#b9a77e 91%,#5c4a30 100%);
 box-shadow:inset 3px 0 6px rgba(60,40,10,.35),inset -3px 0 6px rgba(60,40,10,.35)}
.sym{aspect-ratio:1;display:grid;place-items:center;position:relative;transition:transform .15s;border-bottom:1px solid rgba(90,70,40,.22)}
.sym:last-child{border-bottom:0}
.reel{position:relative}
.strip{position:absolute;left:0;right:0;top:0;display:grid;will-change:transform}
.strip .sym:last-child{border-bottom:1px solid rgba(90,70,40,.22)}
/* spin blur is faked with a stripe overlay (CSS filter blur is too expensive on phones) */
.reel.spinning::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 7px,rgba(60,40,15,.14) 7px 9px)}
.reel.spinning .sym img{opacity:.85}
.reel.tease::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:4px;box-shadow:inset 0 0 0 3px var(--warn),inset 0 0 12px rgba(217,119,43,.55);animation:teasep .28s ease-in-out infinite alternate}
.reel.tease.double::before{box-shadow:inset 0 0 0 4px var(--cadmium),inset 0 0 16px rgba(179,38,30,.6)}
.reel.tease{animation:jit .1s steps(2) infinite}
@keyframes teasep{from{opacity:.45}to{opacity:1}}
@keyframes jit{50%{transform:translateX(1px)}}
.reels.teasing .reel:not(.tease) .sym:not(.hold) img{opacity:.38;transition:opacity .25s}
.reel.lit::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 2px #ffe2a6,inset 0 0 14px rgba(255,190,80,.8);animation:fadeout 1s forwards}
@keyframes fadeout{to{opacity:0}}
.sym img.art{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(40,25,5,.45));pointer-events:none;-webkit-user-drag:none}
.sym>svg{display:none;width:78%;height:78%}
.sym.noart{background:var(--c);border-radius:8px}
.sym.noart>svg{display:block}
.sym::before{content:"";position:absolute;inset:-6%;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,210,120,.95),rgba(255,150,50,.45) 50%,transparent 70%)}
.sym.win{z-index:2}
.sym.win::before{animation:glow 1.1s ease-out}
.sym.win img{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.sym.hold::before{opacity:.55}
@keyframes glow{0%{opacity:0}15%{opacity:1}100%{opacity:.25}}
@keyframes pop{40%{transform:scale(1.22) rotate(-4deg)}}
@keyframes drop{from{transform:translateY(-40%);opacity:.2}to{transform:none;opacity:1}}
.sym.charge img{animation:charge .14s steps(2) infinite}
@keyframes charge{50%{opacity:.4;transform:scale(1.08)}}
.sym.gone img{transform:scale(0);opacity:0;transition:transform .12s ease-in,opacity .12s}
.sym.shut::after{content:"?";position:absolute;inset:3%;z-index:2;display:grid;place-items:center;border-radius:5px;font:400 clamp(22px,8vw,40px) 'Russo One';color:#2a1806;text-shadow:0 1px 0 rgba(255,235,190,.6);
 background:var(--brassg);box-shadow:inset 0 0 0 2px #3a2610,inset 0 2px 0 rgba(255,240,200,.6),0 2px 4px rgba(0,0,0,.5);transform-origin:50% 0;animation:rattle .09s steps(2) infinite}
.sym.shut.open::after{animation:shutter .24s ease-in forwards}
@keyframes rattle{50%{transform:translateX(1px) rotate(.6deg)}}
@keyframes shutter{to{transform:perspective(200px) rotateX(-95deg);opacity:0}}
.reels.blasting .sym{cursor:crosshair}
.reels.blasting .sym.target::before{opacity:1;background:radial-gradient(circle,rgba(255,90,60,.7),rgba(180,30,30,.3) 55%,transparent 72%)}
.reels.blasting .sym.target{outline:2px dashed #ff6a50;outline-offset:-4px}
/* paylines + stamps live inside the reel window */
.paylines{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);z-index:4;pointer-events:none;overflow:visible}
.paylines path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.paylines .trace{stroke:var(--mustard);stroke-width:8;opacity:.92;filter:drop-shadow(0 0 3px rgba(217,119,43,.7)) drop-shadow(0 1px 0 #211E1B)}
.paylines .trace.core{stroke:var(--bone);stroke-width:2;stroke-dasharray:14 3 2 3;filter:none;opacity:.85}
.paylines .ghost{stroke:var(--warn);stroke-width:4;stroke-dasharray:2 9;opacity:.75}
.paylines .sure{stroke:var(--mustard);stroke-width:5;opacity:.85}
.paylines .near{stroke:var(--ash);stroke-width:4;stroke-dasharray:6 7;opacity:.8}
.paylines .demo{stroke:var(--ochre);stroke-width:5;opacity:0}
.stamps{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none}
.stamp{font-family:'Saira Stencil One','Special Elite',Impact,sans-serif;text-transform:uppercase;text-align:center;padding:5px 14px 4px;border:3px solid currentColor;border-radius:2px;color:var(--oxide);line-height:1;
 background:var(--ivory);box-shadow:0 3px 10px rgba(0,0,0,.6),inset 0 0 18px rgba(92,72,56,.45);letter-spacing:.08em;
 -webkit-mask:radial-gradient(circle at 40% 60%,transparent 0 .55px,#000 1.1px) 0 0/7px 9px,linear-gradient(#000,#000);-webkit-mask-composite:source-in;mask:radial-gradient(circle at 40% 60%,transparent 0 .55px,#000 1.1px) 0 0/7px 9px intersect,linear-gradient(#000,#000)}
.stamp b{display:block;font-weight:400;font-size:calc(26px * var(--s,1))}
.stamp small{display:block;font-family:'Special Elite','Courier New',monospace;font-size:12px;letter-spacing:.14em;color:#3a2a14;margin-top:2px}
.stamp.t3,.stamp.t4{color:var(--cadmium)}
.stamp.t4{background:var(--khaki);border-width:5px;border-style:double}
.stamp.chain{color:var(--carbon);background:var(--ochre);border-color:var(--burnt);font-size:13px}
.stamp.chain b{font-size:16px}
.stamp.grey{color:var(--charcoal);background:rgba(137,143,140,.85);border-style:dashed;border-width:2px;box-shadow:none;margin-top:auto;margin-bottom:5%}
.stamp.grey b{font-size:17px}
/* the lever: drag it down (rubber band, ratchet, armed detent), release to spin */
.leverbay{position:relative;flex:0 0 clamp(46px,15vw,70px);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.lslot{position:absolute;left:50%;top:14%;bottom:14%;width:12px;margin-left:-6px;border-radius:6px;background:linear-gradient(90deg,#050302,#1a120c 40%,#050302);box-shadow:0 0 0 2px #6a4a20,inset 0 2px 4px #000}
.lever{position:relative;height:92%;width:100%;display:flex;justify-content:center;touch-action:none;cursor:grab;background:none;padding:0}
.lever img{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;transform-origin:50% 93%;will-change:transform;filter:drop-shadow(3px 4px 3px rgba(0,0,0,.6));pointer-events:none}
.lever.held img{filter:drop-shadow(3px 6px 4px rgba(0,0,0,.7)) brightness(1.08)}
.leverbay.locked{cursor:not-allowed}
.leverbay.locked .lever img{filter:grayscale(.6) brightness(.6)}
.lhint{position:absolute;bottom:-2px;font-size:9px;font-weight:700;letter-spacing:.18em;color:#ffcf7a;text-shadow:0 1px 2px #000;pointer-events:none}
.leverbay.locked .lhint{color:#8a7a60}
.leverbay.beckon .lever img{animation:beckon 2.2s ease-in-out infinite}
@keyframes beckon{0%,70%,100%{transform:none}78%{transform:perspective(420px) rotateX(-22deg)}86%{transform:perspective(420px) rotateX(4deg)}}
.nudges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px 15px 0}
.nudges button{min-height:40px;border-radius:8px;background:linear-gradient(#5a4a3a,#2e241a);border:1px solid #8a6a40;color:#ead9b8;box-shadow:inset 0 1px 0 rgba(255,230,180,.25),0 4px 0 #160f09;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px;transition:transform .06s,box-shadow .06s}
.nudges b{font-size:12px;letter-spacing:.04em;white-space:nowrap}
.nudges b i{font-style:normal;font-size:10px;color:#c8b088}
.nudges small{font-size:10px;font-weight:700;color:#c8b088;white-space:nowrap}
.nudges small.hot{color:#ffd56a}
.nudges button:active:not(:disabled),.nudges button.pressed{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,230,180,.25),0 1px 0 #160f09}
.nudges button:disabled{opacity:.38;cursor:not-allowed}
.nudges button.hint{animation:hint 1s ease-in-out 2}
@keyframes hint{50%{box-shadow:inset 0 1px 0 rgba(255,230,180,.25),0 4px 0 #160f09,0 0 14px rgba(255,190,80,.9)}}
/* heat meter + chain counter (cosmetic) */
.heat{display:flex;align-items:center;gap:6px;margin:8px 15px 0;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--mute)}
.hseg{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.hseg i{height:9px;border-radius:2px;background:#1a110b;box-shadow:inset 0 1px 2px #000,0 0 0 1px #3a2814;transition:background .2s,box-shadow .2s}
.hseg i.on{background:var(--mustard);box-shadow:0 0 5px rgba(217,119,43,.6)}
.hseg i.on.h2{background:var(--warn)}
.hseg i.on.h3{background:var(--cadmium);box-shadow:0 0 7px rgba(179,38,30,.85)}
.chain{min-width:76px;text-align:right;color:#c8a870}
.chain.hot{color:#ffcf7a;text-shadow:0 0 6px rgba(255,150,40,.8)}
.heat.kick{animation:jolt .2s}
/* market tape: amber nixie strip under the marquee */
.tape{display:flex;align-items:center;gap:6px;height:24px;margin:0 6px 6px;padding:0 6px;border-radius:5px;background:linear-gradient(#0a0604,#160d07);box-shadow:inset 0 0 0 1px #5a3c18,inset 0 2px 6px #000,0 1px 0 rgba(255,220,160,.15);overflow:hidden;font:700 12px/1 'Chakra Petch',monospace;color:#ffb347;text-shadow:0 0 6px rgba(255,140,40,.7);cursor:help}
.tape-lamp{flex:none;width:7px;height:7px;border-radius:50%;background:#7a7a3c;box-shadow:0 0 5px #b0a050}
.tape-lamp.stale{background:#a02a20;box-shadow:0 0 6px #ff5a40}
.tape-px{flex:none;font-family:'Russo One';font-weight:400;font-size:13px;letter-spacing:.04em;color:#ffd890;font-variant-numeric:tabular-nums}
.tape-px span{display:inline-block}
.tape-px .flip{animation:flipd .35s}
.tape-px.up{color:#c8c890}.tape-px.dn{color:#e08a6a}
@keyframes flipd{0%{transform:rotateX(90deg);opacity:.2}100%{transform:none}}
.tape-scroll{flex:1;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tape-track{display:inline-flex;white-space:nowrap;animation:tape 36s linear infinite;will-change:transform}
.tape-track span{padding-right:22px}
.tape-track .seed{color:#fff0c0}
@keyframes tape{to{transform:translateX(-50%)}}
.tape.seeding{box-shadow:inset 0 0 0 1px #ffcf7a,inset 0 2px 6px #000,0 0 12px rgba(255,170,60,.6)}
.digit{position:fixed;z-index:60;pointer-events:none;font:400 15px 'Russo One';color:#ffd890;text-shadow:0 0 8px rgba(255,150,40,.9)}
/* visible cost: the bite the next spin takes out of the energy bar */
.ebar{position:relative;width:46px;height:6px;border-radius:3px;background:#120c08;box-shadow:inset 0 1px 2px #000;overflow:hidden}
.ebar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
#ebar{background:linear-gradient(90deg,#b8772a,#ffd56a);transition:width .45s cubic-bezier(.3,.7,.3,1)}
#ecost{background:repeating-linear-gradient(135deg,#d0464a 0 3px,#7a1418 3px 6px);opacity:.85;transition:left .45s,width .3s}
.stat.hit{animation:hitstat .35s}
@keyframes hitstat{30%{transform:translateY(2px) scale(.97);filter:brightness(1.5) saturate(1.4)}}
.stat.bump b,.tabs button.bump small{display:inline-block;animation:bump .4s}
@keyframes bump{30%{transform:scale(1.5);color:#ffe2a6}}
.stat.reject,.tabs button.reject{animation:reject .4s}
@keyframes reject{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.costbump{animation:costbump .5s}
@keyframes costbump{0%{transform:translateY(-6px);opacity:0}100%{transform:none;opacity:1}}
/* top-level effect layers (outside #app, so render() can't cut them off) */
.flyer{position:fixed;z-index:70;pointer-events:none;object-fit:contain;will-change:transform;filter:drop-shadow(0 0 8px rgba(255,190,80,.95)) drop-shadow(0 3px 3px #000)}
.coinfly{position:fixed;z-index:70;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 35%,#fff0c0,#e0a845 50%,#6a4210);box-shadow:0 0 6px rgba(255,170,60,.8)}
.flash{position:fixed;inset:0;z-index:65;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(221,217,206,.75),rgba(217,119,43,.35) 40%,rgba(33,30,27,.3))}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:68;pointer-events:none}

 background:radial-gradient(circle at 50% 40%,#1a120c,#070504);box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #3a2a18,0 0 0 2px #8a6630,0 1px 0 3px rgba(0,0,0,.4)}

/* roster sprite units: an animated sheet whose foot point sits on (x,y) */
.fu.sp{transform:translate(var(--tx),var(--ty))}
.fu.sp .body{position:relative}
.fu.sp .sheet{position:absolute;inset:0;background-repeat:no-repeat}
.fu.sp::before{content:"";position:absolute;left:calc(var(--fx) * 100%);top:calc(var(--fy) * 100%);width:var(--sw);aspect-ratio:3.2;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(12,8,4,.55),rgba(12,8,4,.25) 65%,transparent);pointer-events:none}
.fu.sp.walk .body,.fu.sp .body.atk{animation:none}
.fu.sp .hp{left:calc(var(--fx) * 100% - 15%);right:auto;width:30%;top:calc(var(--hy) * 100% - 9px)}
.fu.sp.orb .hp{width:60%;left:calc(var(--fx) * 100% - 30%);height:4px}
.fu.sp .lv{top:calc(var(--hy) * 100% - 24px)}
.fu.sp.sel::after{left:calc(var(--fx) * 100%);top:calc(var(--fy) * 100%);right:auto;bottom:auto;width:calc(var(--sw) * 1.15);height:auto;aspect-ratio:3.2;transform:translate(-50%,-50%)}
.fu.sp.dead{opacity:0;transform:translate(var(--tx),var(--ty));transition:opacity .6s 1.1s}
.fu.stow{opacity:0}
.fu .ring{opacity:0;transition:opacity .3s;position:absolute;left:calc(var(--fx) * 100%);top:calc(var(--fy) * 100%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(183,140,255,.4);background:radial-gradient(closest-side,transparent 80%,rgba(183,140,255,.12));pointer-events:none;animation:aura 2.4s ease-in-out infinite}
#field .fu.sel .ring{opacity:1}#field .fu.sp:not([data-id]) .ring{opacity:.45}
@keyframes aura{50%{border-color:rgba(183,140,255,.7)}}
.intel{margin-top:4px;color:#66c8ff;font-weight:600}

.zone{position:absolute;left:0;top:0;bottom:0;width:45%;background:linear-gradient(90deg,rgba(217,164,65,.12),rgba(217,164,65,.02));border-right:2px dashed rgba(230,180,90,.55);transition:background .2s}

.hp{position:absolute;left:14%;right:14%;top:-4%;height:5px;background:rgba(0,0,0,.7);border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.4)}

.fu.dead{opacity:0;transform:translate(-50%,-82%) scale(.5) rotate(25deg);transition:opacity .5s,transform .5s;pointer-events:none}
.fu.walk .body{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7%)}}
.fu .body.atk{animation:atkR .22s}
.enemy .body.atk{animation:atkL .22s}
@keyframes atkR{50%{transform:translateX(20%)}}

@keyframes hit{0%,100%{filter:none}40%{filter:brightness(3) saturate(0)}}
.proj{position:absolute;width:6px;height:6px;border-radius:50%;margin:-3px 0 0 -3px;background:currentColor;box-shadow:0 0 8px currentColor;z-index:99;pointer-events:none}

/* reduced motion: keep the information, drop the movement */
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
 .bulb:not(.dead),.mq-title{animation:none!important;opacity:1}
 .tape-track{animation:none!important}
}

/* ================= LAYOUT B: "field hero + cabinet console" (2026-11-25) =================
   One screen, no page scroll, no tabs. Battlefield frame on top (economy strip on its top edge, incursion ribbon on the field),
   slot console docked under it. Spacing scale: 4 / 6 / 8 / 12 / 16. */
.wrap.ingame{max-width:none;height:100svh;overflow:hidden;display:flex;flex-direction:column;

 case 'mech':return `<svg viewBox="0 0 40 40">${sh(20,13)}<rect x="12" y="28" width="5" height="9" rx="2" fill="${u.d}"/><rect x="23" y="28" width="5" height="9" rx="2" fill="${u.d}"/><rect x="9" y="14" width="22" height="16" rx="4" fill="${u.c}"/><rect x="3" y="16" width="6" height="12" rx="3" fill="${u.d}"/><rect x="31" y="16" width="6" height="12" rx="3" fill="${u.d}"/><rect x="13" y="6" width="14" height="9" rx="3" fill="${u.d}"/><rect x="15" y="9" width="10" height="3" rx="1.5" fill="#ff3b5c"/><rect x="14" y="19" width="12" height="4" rx="2" fill="rgba(255,255,255,.35)"/></svg>`;

  return g(`<rect x="12" y="21" width="16" height="15" rx="3" fill="#5a4a6a"/><rect x="6" y="22" width="9" height="4" rx="2" fill="${c}" transform="rotate(${t==='runner'?20:0} 10 24)"/><rect x="25" y="20" width="10" height="4" rx="2" fill="${c}"/><circle cx="20" cy="14" r="7.5" fill="${c}"/><path d="M15 12l3 3m0-3l-3 3M22 12l3 3m0-3l-3 3" stroke="#200" stroke-width="1.5"/><path d="M16 19h8" stroke="#300" stroke-width="1.6"/><path d="M15 32l-1 4M25 32l2 4" stroke="#3a2a4a" stroke-width="3"/>`);}

 const c=t==='jugg'?'#c0303f':'#d0504a';
 if(t==='gunner')return g(`<rect x="10" y="28" width="20" height="8" rx="3" fill="#3a3a44"/><rect x="11" y="16" width="18" height="13" rx="4" fill="${c}"/><rect x="4" y="19" width="10" height="4" rx="1" fill="#2a2a33"/><circle cx="22" cy="21" r="3.2" fill="#ffd23f"/><circle cx="22" cy="21" r="1.4" fill="#300"/>`);

// painted art (falls back to the SVG sprite if the image is missing)
const symArt=t=>`<img class="art" src="art/s-${t}.webp" alt="" draggable="false" onerror="this.parentNode.classList.add('noart');this.remove()">`;
const itemArt=id=>`<img src="art/i-${id}.webp" alt="" draggable="false" onerror="this.remove()">`;
// ---------- SPRITE SHEETS (pre-rendered 3D, tools/bake-unit.py + pack-unit.py) ----------
// Every sheet carries px-per-metre, so all units share one world scale: the field is M_FIELD metres wide.
const M_FIELD=28,AURA_R=12,SHEETS={};
const sheetUrl=k=>k.startsWith('orb-')?`assets/units/orb/sheet-${k.slice(4)}`:`assets/units/${k}/sheet-v2`;

 j.rows=1+Math.max(...Object.values(j.clips).map(c=>c.row));j.url=sheetUrl(k)+'.webp';j.w=j.frameWidth/j.ppm/M_FIELD*100*(k.startsWith('orb')?1.5:1);SHEETS[k]=j;new Image().src=j.url}).catch(()=>{})));
function sheetBox(k){const S=SHEETS[k];if(!S)return null;const sw=(k.startsWith('orb')?.45:k==='drone'?1.1:.95)*S.ppm/S.frameWidth*100;
 return {style:`width:calc(var(--uz,1) * ${S.w.toFixed(2)}%);aspect-ratio:${S.frameWidth}/${S.frameHeight};--tx:${(-S.foot[0]*100).toFixed(1)}%;--ty:${(-S.foot[1]*100).toFixed(1)}%;--fx:${S.foot[0]};--fy:${S.foot[1]};--hy:${S.head??.1};--sw:${sw.toFixed(1)}%`,
  body:`<div class="sheet" data-k="${k}" style="background-image:url(${S.url});background-size:${S.cols*100}% ${S.rows*100}%"></div>`}}
const anims=new Set();
function play(el,clip,o={}){
 const S=el&&SHEETS[el.dataset.k],c=S&&S.clips[clip];if(!c)return 0;
 el._a={c,clip,t0:performance.now()-(o.off||0),loop:c.loop&&!o.once,then:o.then||null,hold:!!o.hold,i:-1};anims.add(el);return c.n/c.fps*1000;
}
function tick(now){
 const k=F?speed:1;
 for(const el of anims){if(!el.isConnected){anims.delete(el);continue}const a=el._a,c=a.c,S=SHEETS[el.dataset.k];
  let i=Math.floor((now-a.t0)/1000*c.fps*k);
  if(i>=c.n){if(a.loop)i%=c.n;else if(a.hold)i=c.n-1;else{play(el,a.then||el._base||'idle');continue}}
  if(i!==a.i){a.i=i;el.style.backgroundPosition=`${S.cols>1?i/(S.cols-1)*100:0}% ${S.rows>1?c.row/(S.rows-1)*100:0}%`}}
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);

const HIT={soldier:['hit'],drone:['hit'],orb:['hit'],sniper:['hit1','hit2'],outrider:['hit1','hit2','hit3'],lancer:['hit1','hit2'],hacker:['hit1','hit2'],commander:['hit1','hit2']};
function baseClip(f){const t=kindOf(f);
 if(f.moving)return t==='outrider'?'run':t==='drone'||t==='orb'?'fly':'walk';

const CX={drone:'wasp'};
const UPSHORT={cap:'Barracks',energy:'Reactor',spins:'Lever',slots:'Rack',nudge:'Motor',start:'Supply'};
function bulbs(){const o=[],T=10,S=8;let i=0;const b=(x,y)=>o.push(`<span class="bulb ${i%7===4?'dead':''}" style="left:${x}%;top:${y}%;--i:${i++}"></span>`);
 for(let k=0;k<T;k++)b(4+92*k/(T-1),2.6);for(let k=1;k<S;k++)b(97,2.6+94.8*k/S);for(let k=T-1;k>=0;k--)b(4+92*k/(T-1),97.4);for(let k=S-1;k>0;k--)b(3,2.6+94.8*k/S);return o.join('')}

// ---------- STATE ----------

let meta={chips:0,maxLevel:1,up:{cap:0,energy:0,spins:0,slots:0,nudge:0,start:0}};
try{const m=JSON.parse(localStorage.getItem(META_KEY));if(m&&m.up)meta=Object.assign(meta,m)}catch(e){}
const saveMeta=()=>{try{localStorage.setItem(META_KEY,JSON.stringify(meta))}catch(e){}};
let mtab='slot', R=null, view='home', pickLevel=meta.maxLevel, pickDepth=meta.lastDepth||10, busy=false, speed=1, uid=1;
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const has=id=>R.items.filter(i=>i===id).length;

const perTurn=()=>25+5*meta.up.energy+8*has('cell');

const army=()=>R.army;
// rng: reel rolls pass the market-seeded SL.rng; everything else uses Math.random
function randSym(rng=Math.random){let r=rng()*WSUM;for(const t of TYPES){r-=UNITS[t].w;if(r<0)return t}return 'soldier'}
const theme=l=>THEMES[(l-1)%THEMES.length];

function stats(u){
 const b=UNITS[u.type];let hp=b.hp*LV[u.lvl],atk=b.atk*LV[u.lvl],cd=b.cd,heal=(b.heal||0)*LV[u.lvl],f={};
 const mods=[];if(u.lvl>=2)mods.push(PATHS[u.type][u.p[0]]);if(u.lvl>=3)mods.push(TIER3[u.p[1]]);
 for(const k of['shield','charge','fly','orbs','aura'])if(b[k])f[k]=b[k];
 for(const m of mods){hp*=m.hp||1;atk*=m.atk||1;cd*=m.cd||1;heal*=m.heal||1;for(const k of['splash','all','dodge','taunt','charge','aura','extraOrb','orbPow'])if(m[k])f[k]=m[k]}
 hp*=1+.25*has('kevlar');atk*=1+.2*has('over');
 return Object.assign({maxHp:Math.round(hp),atk:Math.round(atk),cd,heal:Math.round(heal),role:b.role},f);
}
function uname(u){const b=UNITS[u.type].n;if(u.lvl===1)return b;const p=PATHS[u.type][u.p[0]].n;return u.lvl===3?TIER3[u.p[1]].n+' '+p:p}

  return c?`<div class="core f" tabindex="0" title="${coreName(c)}${coreDesc(c)}"><b>${coreName(c).slice(0,2)}</b></div>`:'<div class="core empty" title="Core socket: cores drop from elite and boss waves"></div>'}).join('');

 const nextCost=Math.round(10*Math.pow(has('damp')?1.3:1.5,R.spinsUsed+1));
 const title=battle?'SPIN':left<=0?'NO SPINS':R.energy<c?'LOW ENERGY':left===1?'LAST SPIN':'SPIN';
 const sub=battle?'in battle':left>0?`${c} energy${left>1?` · next ${nextCost}`:''}`:'no spins left';

 $('#ctrl').innerHTML=`<div class="controls prim"><button class="btn gold spinbtn" id="spin" ${ok||busy?'':'disabled'}>${title}<small>${sub}</small><span class="lamps">${Array.from({length:spinCap()},(_,k)=>`<i class="${k<left?'f':''}"></i>`).join('')}</span></button>

 // secondary cluster: Nudges / Blast (+ Shop and Cores on phones, where the tray and the core panel fold into one tap)
 const shopDis=battle||busy?'disabled':'';
 $('#ctrl2').innerHTML=`<div class="controls sec"><button class="btn nudgebtn" disabled>Nudges<small>${R.nudges} left</small></button>

  <button class="btn shopbtn ponly" id="shop2" ${shopDis}>Shop · items<small>${R.credits}c · ${R.items.length}/${slotsMax()}</small><span class="minisock" aria-hidden="true">${R.items.map(id=>itemArt(id)).join('')}${'<i></i>'.repeat(Math.max(0,slotsMax()-R.items.length))}</span></button>
  <button class="btn corebtn ponly" id="cores2">Cores<small>${(R.cores||[]).filter(Boolean).length}/${Math.max(1,Math.min(3,R.coreSockets||meta.coreSockets||1))} socketed</small></button></div>`;
 $('#socks').innerHTML=`<div class="plabel"><span>Items</span><span>${R.items.length}/${slotsMax()}</span></div><div class="trayrow"><button class="btn shopbtn" id="shop" ${shopDis}>Shop<small>${R.credits} credits</small></button>${socketsHTML()}</div>`;
 const cc=$('#ccores');if(cc)cc.innerHTML=coresHTML();

 $('#blast').onclick=()=>{if(busy)return;R.blast=!R.blast;if(R.blast)bus.emit('blast_arm');stopAttract();renderSlotCol()};$('#shop').onclick=openShop;$('#shop2').onclick=openShop;$('#cores2').onclick=openCores;
 const lb=$('#leverbay');if(lb){lb.classList.toggle('locked',!ok&&!busy);setHint(ok||busy?'PULL':'LOCKED')}

 return `<div class="fu ${b?'sp':''} ${o.enemy?'enemy':''} ${o.cls||''}" ${o.id!=null?`data-id="${o.id}"`:''} style="${pos(o.x,o.y)}${b?';'+b.style:''}">${ring}<div class="body">${b?b.body:o.spr}</div>${o.lvl?`<span class="lv">${'★'.repeat(o.lvl)}</span>`:''}<div class="hp"><i style="width:${o.pct}%"></i></div></div>`}

 const battle=R.phase==='battle'&&F;let units='',info;

   info=`<div class="grow"><b>Army ${army().length}/${cap()}</b><div class="mute">${army().length?'Tap a unit, then tap the field to reposition it. Tap two matching units to merge.':'Spin the Summoner. Three in a row deploys a unit here.'}</div>${intel?`<div class="intel">Scout orb intel: ${intel}</div>`:''}</div>`}}
 const boss=battle&&F.E.find(e=>e.boss);
 $('.fieldcol').innerHTML=`<div class="fwrap"><div class="fbox">

  ${battle?'':`<button class="btn red fieldbtn" id="fight2" ${army().length&&!busy?'':'disabled'}>BATTLE!</button>`}${units}</div>

 $('#spd')&&($('#spd').onclick=()=>{speed=speed===1?2:speed===2?3:1;$('#spd').textContent=speed+'x speed'});

// The field is a wide letterbox on desktop and near-square on phones: unit scale follows the field HEIGHT (as on the 100x60 board),
// so sprites keep their size while the board gains width. Tall boxes switch to the portrait painting.
function fitField(){const f=$('#field');if(!f)return;const r=f.getBoundingClientRect();if(!r.width||!r.height)return;
 f.style.setProperty('--uz',Math.max(.45,Math.min(2,r.height*FW/FH/r.width*1.08)).toFixed(3));f.classList.toggle('tall',r.width/r.height<.95)}
addEventListener('resize',()=>{if(view==='game')fitField()});
// Incursion ribbon (on the field): one notch per wave, elite (5/15/25) and boss (10/20/30) markers, the current wave lit.
function trackHTML(battle){const N=R.depth,w=R.wave;let o='';
 for(let i=1;i<=N;i++){const k=isBoss(i)?'boss':isElite(i)?'elite':'',st=i<w?'done':i===w?'now':'';
  o+=`<i class="tn ${k} ${st}" style="left:${((i-.5)/N*100).toFixed(2)}%" title="Wave ${i}${k==='boss'?' · Boss':k==='elite'?' · Elite wave':''}">${i===w?`<b>${i}</b>`:k==='boss'&&N>10?`<em>${i}</em>`:''}</i>`}
 const nb=Math.ceil(w/10)*10,next=isBoss(w)?'Boss wave!':isElite(w)?'Elite wave':`Boss in ${nb-w}`;
 return `<div class="track"><div class="tlab"><span>Wave</span><b>${w}<small>/${N}</small></b><span class="tthm2">Lv${R.level} · ${theme(R.level).n}</span></div><div class="rail"><div class="fill" style="width:${((w-1)/N*100).toFixed(2)}%"></div>${o}</div><div class="tnext ${isBoss(w)||isElite(w)?'hot':''}"><span class="tthm">Lv${R.level} · ${theme(R.level).n}</span>${battle?'<span class="eng">Engaged · </span>':''}${next}</div></div>`}

 $('#go').onclick=()=>newRun(pickLevel,pickDepth);
 $('#homeCodex').onclick=()=>Codex.open();Codex.ready.then(()=>{const p=Codex.progress(),c=$('#cxPct');if(c)c.textContent=p.total?`${p.pct}% declassified`:'';Codex.badge()});
}
Codex.setHold(()=>!!F);
sheetsReady.then(()=>{render();
 const q=new URLSearchParams(location.search);
 // ?slottest=<line1|line2|combo|near|full|dud|nudge|blast|idle>[&army=N][&gear=1]: slot-feel test hook (headless screenshots).
 // Forced grids are built with Math.random and labelled RIGGED (DEBUG) on the tape.
 const st=q.get('slottest');
 if(st){newRun(1);R.energy=150;R.nudges=3;R.blasts=3;if(q.get('gear'))R.items.push('gear');
  for(let k=0;k<+(q.get('army')||0);k++){const t=TYPES[k%TYPES.length],p=freeSpot(UNITS[t].row);R.army.push({id:uid++,type:t,lvl:1,p:[],x:p.x,y:p.y})}
  render();
  const rs=()=>randSym(),pick=(ex=[])=>{let t;do t=rs();while(ex.includes(t));return t};
  const tries=pr=>{for(let i=0;i<60000;i++){const g=Array.from({length:9},rs);if(pr(g))return g}return null};
  window.dwForce=k=>k==='line1'?tries(g=>linesOf(g).length===1):k==='line2'?(()=>{for(let n=0;n<4000;n++){const s=pick(),A=LINES[rnd(8)],B=LINES[rnd(8)];if(A===B)continue;const g=Array.from({length:9},()=>pick([s]));[...A,...B].forEach(i=>g[i]=s);if(linesOf(g).length===2)return g}})()
   :k==='combo'?(()=>{const s=pick(['soldier']),g=Array.from({length:9},()=>pick([s]));[0,1,3,4,5,7,8].forEach(i=>g[i]=s);return g})()
   :k==='near'?tries(g=>!linesOf(g).length&&teaseOf(g).length>0):k==='full'?Array(9).fill(rs()):k==='dud'?tries(g=>!linesOf(g).length&&!teaseOf(g).length):null;
  window.dwSlot={bus,SL,R:()=>R,spin:()=>autoPull('api'),nudge,blast:blastSym,skip:skipNow};
  setTimeout(()=>{if(st==='nudge'){SL.rigNudge=true;nudge(0,1)}else if(st==='blast'){SL.rigBlast=true;blastSym(4)}else if(st!=='idle'){SL.force=st;autoPull('api')}},600);
  return}
 // ?demo=deploy|battle: a run with one of every roster unit (Deployer behind a Lancer), for previews
 const demo=q.get('demo');if(!demo)return;
 newRun(1,+(new URLSearchParams(location.search).get('depth')||10));R.wave=+(new URLSearchParams(location.search).get('wave')||1);makeWave();R.army=[];const at={lancer:[39,30],soldier:[36,16],outrider:[40,47],commander:[29,40],hacker:[31,27],sniper:[12,24],drone:[19,48]};
 for(const t of TYPES)R.army.push({id:uid++,type:t,lvl:t==='hacker'?3:1,p:t==='hacker'?[0,0]:[],x:at[t][0],y:at[t][1]});
 mtab='field';render();if(demo==='battle')setTimeout(startBattle,600)});
}
